name: Laravel CI


on:
   push:
      branches:
         - main
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository yuklash
        uses: actions/checkout@v4


      - name: PHP o'rnatish
        uses: shivammathur/setup-php@v2
        with:
            php-version: 8.3

      - name: PHP versiyasini tekshirish
        run: php -v


      - name: Composer versiyasini tekshirish
        run: composer --version
