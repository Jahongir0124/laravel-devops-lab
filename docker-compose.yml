services:


    app:
      image: developer01242757/laravel-devops-lab:v1
      container_name: laravel-test
      working_dir: /var/www/html
      env_file:
        - .env
      restart: unless-stopped
      # volumes:
      #  - .:/var/www/html
      healtcheck:
        test: ["CMD", "php", "-v"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 20s
    mysql:
       image: mysql:8
       container_name: laravel-mysql
       environment:
          MYSQL_DATABASE: laravel
          MYSQL_USER: laravel
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
       volumes:
         - mysql_data:/var/lib/mysql
       restart: unless-stopped

    nginx:
        image: nginx:latest
        container_name: laravel-nginx
        ports:
          - "8081:80"
        volumes:
          - .:/var/www/html
          - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
          - app
        restart: unless-stopped
    redis:
        image: redis:7
        container_name: laravel-redis
        restart: unless-stopped
volumes:
  mysql_data:
